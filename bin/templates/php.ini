; StuFiS PHP configuration for Hostsharing.net webspaces.
;
; It belongs in the domain's fastcgi directory - Hostsharing reads a php.ini from
; there, and only the values that differ from the system default belong in it
; (see /etc/php/8.4/cgi/php.ini for those defaults). Install it with:
;
;   artisan stufis:php-ini --restart
;
; That copies this file into ~/doms/<domain>/fastcgi/php.ini and
; ~/doms/<domain>/fastcgi-ssl/php.ini for every domain serving this instance,
; backs up whatever was there, and recycles the FastCGI processes. Without
; --restart nothing changes yet: a running process keeps the configuration it
; started with for its whole lifetime, so it has to be replaced by hand:
;
;   pkill -u "$USER" '^php'
;
; Recycling is worth doing after a deployment too - long-lived processes also
; carry an opcache and a realpath cache filled from the previous release.
;
; NOTE: this file configures the *web* SAPI only. `artisan`, `composer` and
; bin/stufis-update run through the CLI binary, which reads
; /etc/php/8.4/cli/php.ini instead - raising memory_limit here does nothing for
; them. Pass `-d memory_limit=...` on the command line if a CLI job needs more.
;
; Extensions cannot be loaded from a user php.ini here. StuFiS needs bcmath,
; fileinfo, iconv, pdo and zip; verify with `php8.4 -m` if something is missing.

[PHP]

; --- Uploads ---------------------------------------------------------------
; Project attachments default to 5 MB but are admin-configurable at runtime
; (project.attachment.max_size_mb), and Livewire's temporary upload endpoint
; caps at 12 MB. These are the hard ceiling behind both, so leave headroom:
; an admin raising the setting past this limit gets a confusing failure, since
; PHP discards the upload before the application ever validates it.
; post_max_size must stay above upload_max_filesize - one request can carry
; several attachments plus the form itself.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 20

; --- Limits ----------------------------------------------------------------
; 256M is enough for Livewire, PDF rendering and the bank-statement imports.
; Instances importing large spreadsheets may need 512M.
memory_limit = 256M

; FinTS dialogs block on the bank's response, and the CSV/XML import parses in
; the request, so the 30s default is too tight. Note that the web server enforces
; its own FastCGI timeout on top of this: if long requests still die well before
; 120s, raising this value will not help - that limit is not ours to set.
max_execution_time = 120
max_input_time = 120

; The legacy budget and booking screens post one field per table row, which
; passes the 1000 default on a realistic Haushaltsplan. Livewire is unaffected
; (it posts a single JSON payload), the legacy pages are not.
max_input_vars = 5000

; --- Locale ----------------------------------------------------------------
; Matches config/app.php. Laravel sets its own default at boot, so this only
; governs code that runs before or outside the framework.
date.timezone = Europe/Berlin

; --- Errors ----------------------------------------------------------------
; Laravel renders its own error pages and writes storage/logs/laravel-<date>.log.
; These settings are the backstop for failures that happen before it boots -
; a fatal at that point must not print a stack trace to a browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.assertions = -1

; --- Hardening -------------------------------------------------------------
expose_php = Off

; --- Performance -----------------------------------------------------------
; FastCGI processes are long-lived, so opcache pays for itself. Laravel plus
; the legacy tree is a lot of files; 20000 keeps the whole app cached.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Deployments are an in-place `git pull` (bin/stufis-update), so PHP must keep
; checking file timestamps. Setting validate_timestamps = 0 is a common
; performance tip and would be actively wrong here: deployed code would keep
; serving the previous release until the processes are killed by hand.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Laravel resolves a lot of paths per request.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
